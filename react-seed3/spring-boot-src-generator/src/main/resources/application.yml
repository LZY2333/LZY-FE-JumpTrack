server:
  port: 8080

spring:
  application:
    name: cies-task-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:cies;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: always
  sql:
    init:
      mode: always
      encoding: UTF-8

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: h2
  reasonable: false
  support-methods-arguments: false

logging:
  level:
    com.cmbwlb.cus.infrastructure.persistence: debug
